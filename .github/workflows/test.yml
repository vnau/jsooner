name: Node.js Test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for the Codecov upload

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      # Only the library; the benchmark's comparison parsers live in the bench workspace package
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter jsooner

      - name: Build
        run: pnpm build

      # Coverage is measured once, on 24.x; the other versions just run the tests
      - if: ${{ matrix.node-version != '24.x' }}
        name: Test
        run: pnpm vitest run

      - if: ${{ matrix.node-version == '24.x' }}
        name: Test with coverage
        run: pnpm test-ci

      # Signs in with GitHub OIDC, so no Codecov token is stored. Pull requests from forks get
      # no OIDC token; the upload then fails without failing the job
      - if: ${{ matrix.node-version == '24.x' }}
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/lcov.info
